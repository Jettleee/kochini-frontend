# KOCHINI single-page app. Listens on 8080 (non-root). TLS is terminated upstream
# (Azure Container Apps ingress / App Gateway / load balancer).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Generated at startup by /docker-entrypoint.d/15-kochini-config.sh
    include /tmp/kochini/security-headers.inc;

    # Liveness/readiness probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime config: never cached, so a new API_URL applies on the next page load
    location = /env-config.js {
        alias /tmp/kochini/env-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        include /tmp/kochini/security-headers.inc;
    }

    # Vite assets have a content hash in their name: cache for a year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /tmp/kochini/security-headers.inc;
    }

    # Hidden files (.git, .env…) are never served
    location ~ /\. {
        return 404;
    }

    # Client-side routes fall back to index.html; index.html is always revalidated
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /tmp/kochini/security-headers.inc;
    }
}
