# Local run of the frontend container, with the same hardening as production.
#   docker compose up --build   →  http://localhost:8080
# FIT-119 will add the backend and PostgreSQL services to this file.
services:
  frontend:
    build:
      context: .
      args:
        APP_VERSION: local
    image: kochini-frontend:local
    ports:
      - "8080:8080"
    environment:
      # Where the browser sends API calls. A path (/api) means same origin, behind a reverse proxy.
      API_URL: http://localhost:8081/api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # backend:
  #   image: kochini-backend:local
  #   ports: ["8081:8080"]
